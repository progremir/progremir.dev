      let pick = null;
      try { pick = localStorage.getItem("theme"); } catch {}
      html.classList.add("js");
      html.dataset.theme = pick === "light" || pick === "dark" ? pick : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
